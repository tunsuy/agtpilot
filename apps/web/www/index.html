<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#fbfbfd" />
    <title>AgtPilot</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #fbfbfd;
        color: #18181b;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        padding-top: calc(32px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 18px;
        background: #18181b;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -1px;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin-bottom: 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: #71717a;
        margin-bottom: 8px;
      }
      .hint {
        margin-top: 24px;
        padding: 14px 16px;
        background: #fff;
        border: 1px solid #e4e4e7;
        border-radius: 14px;
        font-size: 12.5px;
        line-height: 1.7;
        color: #52525b;
        text-align: left;
      }
      .hint code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #f4f4f5;
        padding: 1px 5px;
        border-radius: 5px;
        font-size: 11.5px;
        color: #18181b;
      }
      button {
        margin-top: 22px;
        width: 100%;
        height: 46px;
        border: none;
        border-radius: 12px;
        background: #18181b;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:active {
        background: #3f3f46;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">A</div>
      <h1>无法连接到 AgtPilot 服务</h1>
      <p>你的智能体仍在云端待命。请检查网络连接后重试。</p>
      <div class="hint">
        首次部署时，需要在原生壳里配置服务器地址：<br />
        构建前设置环境变量 <code>AGTPILOT_SERVER_URL</code>，再执行
        <code>npx cap sync</code>。
      </div>
      <button onclick="window.location.reload()">重新加载</button>
    </div>
  </body>
</html>
